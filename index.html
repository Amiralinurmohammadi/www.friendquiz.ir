<style>
:root{--pink:#ff4f91;--pink-dark:#d92f70;--pink-soft:#ffe0ec;--bg:#fff3f8;--card:#fff;--text:#321b28;--muted:#755467;--green:#18a957;--green-soft:#dcf8e8;--red:#e53935;--red-soft:#ffe1e1;--border:#f2cddd;--shadow:0 18px 55px rgba(180,35,95,.15);--radius:24px}
[data-theme="dark"]{--bg:#1c1218;--card:#291b23;--text:#fff1f6;--muted:#d0aebb;--border:#563646;--pink-soft:#4a2637;--green-soft:#173a29;--red-soft:#4a2121;--shadow:0 18px 55px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Vazirmatn,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(255,255,255,.8) 0 60px,transparent 61px),linear-gradient(135deg,var(--pink-soft),var(--bg) 48%,var(--pink-soft));overflow-x:hidden}
[data-theme="dark"] body{background:linear-gradient(135deg,#24151d,#1c1218 55%,#2b1722)}
button{font:inherit}
.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.heart{position:absolute;bottom:-80px;color:var(--pink);opacity:.2;font-size:var(--size);animation:floatUp var(--duration) linear infinite;animation-delay:var(--delay);left:var(--left)}
@keyframes floatUp{0%{transform:translateY(0) rotate(0) scale(.85);opacity:0}12%{opacity:.25}50%{transform:translateY(-50vh) rotate(12deg) scale(1)}100%{transform:translateY(-115vh) rotate(-18deg) scale(1.08);opacity:0}}
.app{position:relative;z-index:1;min-height:100vh;padding:20px 16px 42px;display:flex;justify-content:center}
.container{width:min(820px,100%)}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.tool{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer}
.brand{text-align:center;margin:8px 0 18px}
.brand-heart{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.78);font-size:35px;box-shadow:var(--shadow);animation:heartbeat 1.8s ease-in-out infinite}
[data-theme="dark"] .brand-heart{background:var(--card)}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}56%{transform:scale(1)}}
h1{font-size:clamp(28px,5vw,43px);margin:10px 0 5px}
.subtitle{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:var(--radius);padding:28px}
.screen{display:none}.screen.active{display:block;animation:appear .3s ease}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro{text-align:center}
.badge{display:inline-block;background:var(--pink-soft);color:var(--pink-dark);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:800}
.intro h2{font-size:28px;margin:14px 0 9px}
.intro p{line-height:1.9;color:var(--muted);max-width:620px;margin:0 auto 20px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.feature{padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--pink-soft)}
.feature strong{display:block;font-size:14px}
.feature span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.btn{border:0;cursor:pointer;border-radius:15px;padding:13px 21px;font-weight:900;transition:.18s;touch-action:manipulation}
.btn:hover{transform:translateY(-2px)}
.primary{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-dark));box-shadow:0 10px 24px rgba(0,0,0,.14)}
.secondary{background:var(--card);border:1px solid var(--border);color:var(--pink-dark)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.progress-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--muted)}
.progress-track{height:11px;background:var(--pink-soft);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:10%;background:linear-gradient(90deg,var(--pink),var(--pink-dark));border-radius:99px;transition:.28s}
.question-title{font-size:clamp(22px,4vw,30px);line-height:1.65;margin:22px 0 8px}
.question-note{font-size:13px;color:var(--muted);margin:0 0 18px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{width:100%;min-height:76px;text-align:start;background:var(--card);border:2px solid var(--border);border-radius:18px;padding:14px 16px;color:var(--text);font-weight:800;cursor:pointer;position:relative;transition:.16s;display:flex;align-items:center;gap:10px}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pink)}
.option:disabled{cursor:default}
.letter{display:inline-flex;width:32px;height:32px;flex:none;border-radius:10px;background:var(--pink-soft);color:var(--pink-dark);align-items:center;justify-content:center}
.option.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.option.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.mark{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);font-size:22px}
.feedback{min-height:44px;margin-top:15px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px}
.feedback:empty{display:none}
.ok{background:var(--green-soft);color:var(--green)}
.no{background:var(--red-soft);color:var(--red)}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.score-small{font-weight:900;color:var(--muted)}
.result{text-align:center}
.result-heart{font-size:56px;display:block;animation:heartbeat 1.7s infinite}
.result h2{font-size:31px;margin:8px 0 5px}
.result p{color:var(--muted)}
.score-box{margin:20px 0;padding:16px;border-radius:18px;background:var(--pink-soft);border:1px solid var(--border)}
.score-number{font-size:35px;font-weight:900;color:var(--pink-dark);margin-top:4px}
.interest-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 22px;text-align:start}
.interest{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--pink-soft);border:1px solid var(--border)}
.num{width:30px;height:30px;border-radius:10px;background:var(--card);color:var(--pink-dark);display:grid;place-items:center;font-weight:900;flex:none}
.interest strong{font-size:14px}
.interest span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.9;margin-top:14px}
.footer a{color:var(--pink-dark);font-weight:800;text-decoration:none;unicode-bidi:isolate}
.footer a:hover{text-decoration:underline}
.tool.off{opacity:.45}
.timer-text{font-weight:900;font-variant-numeric:tabular-nums}
.timer-text.low{color:var(--red)}
.timer-track{height:6px;background:var(--pink-soft);border-radius:99px;overflow:hidden;margin-top:8px}
.timer-fill{height:100%;width:100%;background:var(--green);border-radius:99px;transition:width .12s linear,background .2s}
.timer-fill.low{background:var(--red)}
.result-message{margin-top:10px;font-size:17px;font-weight:800;line-height:1.7;color:var(--text)}
.confetti{position:fixed;top:-16px;width:9px;height:14px;z-index:40;pointer-events:none;border-radius:2px;animation:confettiFall var(--d) linear forwards}
@keyframes confettiFall{to{transform:translateY(112vh) translateX(var(--x)) rotate(var(--r))}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24151d;color:#fff;padding:10px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* ---- Language panel / پنل زبان / Sprachwahl ---- */
.blurred{filter:blur(9px);pointer-events:none;user-select:none}
.gate{position:fixed;inset:0;z-index:25;display:none;place-items:center;padding:20px;background:rgba(40,10,25,.35)}
.gate.show{display:grid}
.gate-card{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px;text-align:center}
.gate-card h2{margin:6px 0;font-size:22px}
.gate-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
.lang-list{display:grid;gap:10px;margin-top:18px}
.lang-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:15px;border:2px solid var(--border);background:var(--card);color:var(--text);font-weight:900;font-size:16px;cursor:pointer;transition:.16s}
.lang-btn:hover{border-color:var(--pink);transform:translateY(-2px)}
.lang-btn.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink-dark)}
.btn:focus-visible,.tool:focus-visible,.option:focus-visible,.lang-btn:focus-visible,.footer a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media(max-width:600px){.card{padding:18px}.options,.interest-list,.features{grid-template-columns:1fr}.option{min-height:68px}.brand-heart{width:62px;height:62px;font-size:31px}.question-title{font-size:23px}.next-row{align-items:stretch;flex-direction:column}.next-row .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
(() => {
  "use strict";

  // ------------------------------------------------------------------

  // false => the language panel only appears on the first visit.

  // Seconds per question when the timer is on (the ⏱️ button turns it on/off).

  const OPTION_COUNT = 4;

  const ACCENT = { pink: "#ff4f91", dark: "#d92f70", soft: "#ffe0ec", softDark: "#4a2637" };

  // localStorage can throw (private mode, blocked cookies) -> never crash the app
  const store = {

    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }

  // ------------------------------------------------------------------

      options: [["🍕 پیتزا","Pizza","🍕 Pizza"],["🍔 برگر","Burgers","🍔 Burger"],["🍣 سوشی","Sushi","🍣 Sushi"],["🍝 پاستا","Pasta","🍝 Pasta"]] },
    { fa: "برای یک روز آزاد کدام گزینه بیشتر به او می‌خورد؟", en: "Which free-day plan sounds most like your friend?", de: "Welcher Plan für einen freien Tag passt am besten zu ihm?",
      options: [["🌳 طبیعت و پیاده‌روی","Nature & walking","🌳 Natur & Spaziergänge"],["🛍️ خرید و شهرگردی","Shopping & city","🛍️ Shoppen & Stadt"],["🏠 خانه و استراحت","Home & relaxing","🏠 Zuhause & Entspannen"],["🎉 مهمانی و دوستان","Party & friends","🎉 Party & Freunde"]] },

      options: [["💬 یک گفت‌وگوی خوب","A great conversation","💬 Ein gutes Gespräch"],["🎁 یک سورپرایز","A surprise","🎁 Eine Überraschung"],["🏆 موفقیت و بردن","Winning & success","🏆 Erfolg & Gewinnen"],["💖 وقت با آدم‌های مورد علاقه","Time with loved ones","💖 Zeit mit Lieblingsmenschen"]] },

  // ------------------------------------------------------------------

    fa: {

      feature3: "مناسب موبایل",
      feature3sub: "دکمه‌ها و کیبورد",

  const LANG_NAMES = { fa: "فارسی", en: "English", de: "Deutsch" };
  const LANG_FLAGS = { fa: "🇮🇷", en: "🇬🇧", de: "🇩🇪" };

  // Persian keyboards type ۱ ۲ ۳ ۴ instead of 1 2 3 4
  const KEY_TO_OPTION = { "1": 0, "2": 1, "3": 2, "4": 3, "۱": 0, "۲": 1, "۳": 2, "۴": 3 };

  // ------------------------------------------------------------------
  // State / وضعیت / Zustand
  // ------------------------------------------------------------------

  const $ = (id) => document.getElementById(id);
  const SCREENS = ["intro", "quiz", "result"];

  const savedLang = store.get(LANG_KEY);
  const state = {
    lang: LANGS.includes(savedLang) ? savedLang : "fa",
    theme: store.get(THEME_KEY) === "dark" ? "dark" : "light",
    screen: "intro",
    active: null,
    index: 0, score: 0, answers: [], marks: [],
    timerOn: store.get(TIMER_KEY) !== "off",
    remaining: QUESTION_SECONDS * 1000, deadline: 0, timerId: null
  };

  function t(key) {
    return (COPY[state.lang] && COPY[state.lang][key]) || COPY.fa[key] || "";
  }

  // Localised numbers: ۱۰ in Persian, 10 in English/German
  function n(value) {
    try {
      return new Intl.NumberFormat(state.lang === "fa" ? "fa-IR" : state.lang, { useGrouping: false }).format(value);
    } catch (e) {
      return String(value);
    }
  }
  const pct = (value) => n(value) + (state.lang === "fa" ? "٪" : "%");

  const letterOf = (i) => String.fromCharCode(65 + i);

  let toastTimer;
  function toast(message) {
    clearTimeout(toastTimer);
    $("toast").textContent = message;
    $("toast").classList.add("show");
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2800);
  }

  function applyTheme() {
    document.documentElement.dataset.theme = state.theme === "dark" ? "dark" : "";
    $("themeBtn").textContent = state.theme === "dark" ? "☀️" : "🌙";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = state.theme === "dark" ? "#1c1218" : ACCENT.pink;
  }

  function applyAccent() {
    const root = document.documentElement.style;
    root.setProperty("--pink", ACCENT.pink);
    root.setProperty("--pink-dark", ACCENT.dark);
    root.setProperty("--pink-soft", state.theme === "dark" ? ACCENT.softDark : ACCENT.soft);
  }

  function show(id) {
    state.screen = id;
    SCREENS.forEach((s) => $(s).classList.toggle("active", s === id));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ------------------------------------------------------------------
  // Timer / تایمر / Timer
  // ------------------------------------------------------------------

  function updateTimerUI() {
    const on = state.timerOn;
    $("timerText").style.display = on ? "" : "none";
    $("timerTrack").style.display = on ? "" : "none";
    $("timerBtn").classList.toggle("off", !on);
    $("timerBtn").setAttribute("aria-pressed", on ? "true" : "false");
    if (!on) return;
    const seconds = Math.ceil(state.remaining / 1000);
    const low = state.remaining <= 5000;
    $("timerText").textContent = "⏱ " + n(seconds);
    $("timerText").classList.toggle("low", low);
    $("timerFill").classList.toggle("low", low);
    $("timerFill").style.width = Math.max(0, (state.remaining / (QUESTION_SECONDS * 1000)) * 100) + "%";
  }

  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }

  // Freeze the clock but remember the time left (language panel, hidden tab)
  function pauseTimer() {
    if (!state.timerId) return;
    state.remaining = Math.max(0, state.deadline - Date.now());
    stopTimer();
  }

  function runTimer() {
    stopTimer();
    state.deadline = Date.now() + state.remaining;
    state.timerId = setInterval(() => {
      state.remaining = Math.max(0, state.deadline - Date.now());
      updateTimerUI();
      if (state.remaining <= 0) { stopTimer(); handleTimeout(); }
    }, 100);
  }

  function resumeTimer() {
    if (!state.timerOn || state.timerId || state.screen !== "quiz") return;
    if (state.answers[state.index] !== undefined || state.remaining <= 0) return;
    if ($("langGate").classList.contains("show") || document.hidden) return;
    runTimer();
  }

  function startTimer() {
    stopTimer();
    state.remaining = QUESTION_SECONDS * 1000;
    updateTimerUI();
    if (state.timerOn) runTimer();
  }

  function handleTimeout() {
    if (state.screen !== "quiz" || state.answers[state.index] !== undefined) return;
    state.answers[state.index] = -1;                    // -1 = no answer (time ran out)
    state.marks[state.index] = { correct: false, correctIndex: builtinCorrect(state.index), timeout: true };
    renderQuestion();
    playResult(false);
  }

  // ------------------------------------------------------------------
  // Fun result messages & confetti / پیام نتیجه / Ergebnis-Nachrichten
  // ------------------------------------------------------------------

  function resultTier(percentage) {
    if (percentage === 100) return { key: "m100", emoji: "🏆" };
    if (percentage >= 80) return { key: "m80", emoji: "🎉" };
    if (percentage >= 60) return { key: "m60", emoji: "😊" };
    if (percentage >= 40) return { key: "m40", emoji: "🙂" };
    if (percentage >= 20) return { key: "m20", emoji: "😅" };
    return { key: "m0", emoji: "🥲" };
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = ["#ff4f91", "#ffd166", "#18a957", "#4cc9f0", "#b388ff", "#ff7a59"];
    for (let i = 0; i < 46; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[i % colors.length];
      piece.style.setProperty("--d", (2.4 + Math.random() * 2) + "s");
      piece.style.setProperty("--x", (Math.random() * 160 - 80) + "px");
      piece.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
      piece.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 5500);
    }
  }

  // ------------------------------------------------------------------
  // Playing / بازی کردن / Spielen
  // ------------------------------------------------------------------

  function builtinQuiz() {
    const langIndex = LANGS.indexOf(state.lang);
    return {
      title: t("title"),
      total: BUILTIN.length,
      questions: BUILTIN.map((q) => ({
        text: q[state.lang] || q.fa,
        options: q.options.map((o) => o[langIndex] || o[0])
      }))
    };
  }

  function resetPlay() {
    state.index = 0;
    state.score = 0;
    state.answers = [];
    state.marks = [];
  }

  function startQuiz() {
    state.active = builtinQuiz();
    resetPlay();
    show("quiz");
    renderQuestion();
    startTimer();
  }

  function grade(index, choice) {
    const correctIndex = builtinCorrect(index);
    return { correct: choice === correctIndex, correctIndex: correctIndex };
  }

  function renderQuestion() {
    const quiz = state.active;
    if (!quiz) return;
    const q = quiz.questions[state.index];
    const chosen = state.answers[state.index];
    const mark = state.marks[state.index];

    $("counter").textContent = t("counter") + " " + n(state.index + 1) + " / " + n(quiz.total);
    $("scoreText").textContent = t("score") + ": " + n(state.score);
    $("progressFill").style.width = ((state.index + 1) / quiz.total) * 100 + "%";
    $("questionTitle").textContent = q.text;
    $("questionNote").textContent = t("choose");
    $("answeredText").textContent = n(chosen === undefined ? state.index : state.index + 1) + " " + t("answered");

    const box = $("options");
    box.innerHTML = "";
    q.options.forEach((option, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = letterOf(i);
      letter.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.textContent = option;
      btn.appendChild(letter);
      btn.appendChild(label);
      btn.addEventListener("click", () => chooseOption(i));
      box.appendChild(btn);
    });

    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("nextBtn").style.display = "none";

    if (chosen === undefined || !mark) return;

    [...box.querySelectorAll(".option")].forEach((btn, i) => {
      btn.disabled = true;
      if (i === mark.correctIndex) {
        btn.classList.add("correct");
        const tick = document.createElement("span");
        tick.className = "mark";
        tick.setAttribute("aria-hidden", "true");
        tick.textContent = "✓";
        btn.appendChild(tick);
      }
      if (i === chosen && chosen !== mark.correctIndex) {
        btn.classList.add("wrong");
        const cross = document.createElement("span");
        cross.className = "mark";
        cross.setAttribute("aria-hidden", "true");
        cross.textContent = "×";
        btn.appendChild(cross);
      }
    });

    if (mark.correct) {
      $("feedback").className = "feedback ok";
      $("feedback").textContent = t("correct");
    } else {
      $("feedback").className = "feedback no";
      $("feedback").textContent = (mark.timeout ? t("timeout") : t("wrong")) + " " + t("correctAnswer") + ": " + q.options[mark.correctIndex];
    }

    $("nextBtn").style.display = "inline-block";
    $("nextBtn").textContent = state.index === quiz.total - 1 ? t("finish") : t("next");
  }

  // ---- Sound effects (Web Audio, no audio files needed) ----
  // note: [frequency, start (s), duration, wave type, end frequency (optional)]
  const SOUND_OK = [[400, 0, .25, "sine", 1000]];
  const SOUND_NO = [[311, 0, .25, "sawtooth"], [294, .25, .25, "sawtooth"], [277, .5, .25, "sawtooth"], [262, .75, .5, "sawtooth", 200]];
  let audioCtx = null;

  function playNotes(notes) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      notes.forEach(([f, at, dur, type, f2]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, now + at);
        if (f2) osc.frequency.exponentialRampToValueAtTime(f2, now + at + dur);
        gain.gain.setValueAtTime(0.0001, now + at);
        gain.gain.exponentialRampToValueAtTime(type === "sawtooth" ? 0.1 : 0.2, now + at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + at + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + at);
        osc.stop(now + at + dur + 0.05);
      });
    } catch (err) {
      console.warn("Sound failed:", err);
    }
  }

  function soundMuted() {
    return store.get(SOUND_KEY) === "off";
  }

  function playResult(correct) {
    if (!soundMuted()) playNotes(correct ? SOUND_OK : SOUND_NO);
  }

  function updateSoundBtn() {
    $("soundBtn").textContent = soundMuted() ? "🔇" : "🔊";
  }

  function chooseOption(choice) {
    if (state.answers[state.index] !== undefined) return;
    stopTimer();
    const mark = grade(state.index, choice);
    state.answers[state.index] = choice;
    state.marks[state.index] = mark;
    if (mark.correct) state.score += 1;
    renderQuestion();
    playResult(!!mark.correct);
  }

  function nextQuestion() {
    if (state.answers[state.index] === undefined) {
      $("feedback").className = "feedback no";
      $("feedback").textContent = t("choose");
      return;
    }
    if (state.index < state.active.total - 1) {
      state.index += 1;
      renderQuestion();
      startTimer();
    } else {
      stopTimer();
      renderResult();
      show("result");
      if (resultTier(Math.round((state.score / state.active.total) * 100)).key === "m80" ||
          state.score === state.active.total) confetti();
    }
  }

  function renderResult() {
    const quiz = state.active;
    const percentage = Math.round((state.score / quiz.total) * 100);
    const tier = resultTier(percentage);
    $("resultEmoji").textContent = tier.emoji;
    $("resultMessage").textContent = t(tier.key);
    $("finalScore").textContent = pct(percentage);
    $("correctCount").textContent = t("correctCount") + ": " + n(state.score) + " / " + n(quiz.total);

    const list = $("answerList");
    list.innerHTML = "";
    quiz.questions.forEach((q, i) => {
      const chosen = state.answers[i];
      const mark = state.marks[i] || {};
      const item = document.createElement("div");
      item.className = "interest";

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = n(i + 1);

      const body = document.createElement("div");
      const chosenLabel = document.createElement("strong");
      chosenLabel.textContent = chosen === undefined || chosen < 0 ? "—" : q.options[chosen];
      const questionLabel = document.createElement("span");
      questionLabel.textContent = q.text;
      const correctLabel = document.createElement("span");
      correctLabel.textContent = (mark.correct ? "✓ " : mark.timeout ? "⏰ " : "× ") + t("correctAnswer") + ": " +
        (mark.correctIndex === undefined ? "—" : q.options[mark.correctIndex]);
      body.appendChild(chosenLabel);
      body.appendChild(questionLabel);
      body.appendChild(correctLabel);

      item.appendChild(num);
      item.appendChild(body);
      list.appendChild(item);
    });
  }

  // ------------------------------------------------------------------
  // Copy & share (100% local) / کپی و اشتراک‌گذاری / Kopieren & Teilen
  // ------------------------------------------------------------------

  async function copyText(text, okMessage) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        if (!ok) throw new Error("copy failed");
      }
      toast(okMessage);
    } catch (err) {
      toast(t("copyFail"));
    }
  }

  async function shareText(text) {
    try {
      if (navigator.share) { await navigator.share({ text: text }); return; }
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
    copyText(text, t("shareDone"));
  }

  function shareResult() {
    const quiz = state.active;
    if (!quiz) return;
    const percentage = Math.round((state.score / quiz.total) * 100);
    shareText(quiz.title + " 💗\n" + t("correctCount") + ": " + n(state.score) + "/" + n(quiz.total) + " (" + pct(percentage) + ")");
  }

  // ------------------------------------------------------------------
  // Static texts / متن‌های ثابت / Feste Texte
  // ------------------------------------------------------------------

  function renderTexts() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "fa" ? "rtl" : "ltr";
    document.title = t("title");
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.content = t("subtitle");

    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-label]").forEach((el) => {
      const label = t(el.dataset.i18nLabel);
      el.setAttribute("aria-label", label);
      el.title = label;
    });

    updateTimerUI();

    // Rebuild the open screen in the new language (answers are kept)
    if (state.screen === "quiz" || state.screen === "result") {
      state.active = builtinQuiz();
      if (state.screen === "quiz") renderQuestion(); else renderResult();
    }
  }

  // ------------------------------------------------------------------
  // Language panel / پنل زبان / Sprachwahl
  // ------------------------------------------------------------------

  let lastFocus = null;
  const hasSavedLang = () => LANGS.includes(store.get(LANG_KEY));

  function setBlur(on) {
    document.querySelectorAll(".app, .hearts").forEach((el) => el.classList.toggle("blurred", on));
    document.querySelector(".app").toggleAttribute("inert", on);
  }

  function openLangGate() {
    lastFocus = document.activeElement;
    pauseTimer();
    const list = $("langList");
    list.innerHTML = "";
    LANGS.forEach((code) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang-btn" + (code === state.lang ? " on" : "");
      btn.lang = code;
      btn.dir = code === "fa" ? "rtl" : "ltr";
      const flag = document.createElement("span");
      flag.textContent = LANG_FLAGS[code];
      flag.setAttribute("aria-hidden", "true");
      const name = document.createElement("span");
      name.textContent = LANG_NAMES[code];
      btn.appendChild(flag);
      btn.appendChild(name);
      btn.addEventListener("click", () => setLang(code, true));
      list.appendChild(btn);
    });
    $("langGate").classList.add("show");
    setBlur(true);
    const first = list.querySelector(".lang-btn.on") || list.querySelector(".lang-btn");
    if (first) first.focus();
  }

  function closeLangGate() {
    $("langGate").classList.remove("show");
    setBlur(false);
    resumeTimer();
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }

  function setLang(code, alsoClose) {
    state.lang = LANGS.includes(code) ? code : "fa";
    store.set(LANG_KEY, state.lang);
    renderTexts();
    updateSoundBtn();
    if (alsoClose) closeLangGate();
  }

  // ------------------------------------------------------------------
  // Events / رویدادها / Ereignisse
  // ------------------------------------------------------------------

  $("startBtn").addEventListener("click", startQuiz);
  $("nextBtn").addEventListener("click", nextQuestion);
  $("shareBtn").addEventListener("click", shareResult);
  $("restartBtn").addEventListener("click", startQuiz);

  $("themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    store.set(THEME_KEY, state.theme);
    applyTheme();
    applyAccent();
  });

  $("timerBtn").addEventListener("click", () => {
    state.timerOn = !state.timerOn;
    store.set(TIMER_KEY, state.timerOn ? "on" : "off");
    if (!state.timerOn) {
      stopTimer();
    } else if (state.screen === "quiz" && state.answers[state.index] === undefined) {
      startTimer();
    }
    updateTimerUI();
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pauseTimer(); else resumeTimer(); });

  $("langBtn").addEventListener("click", openLangGate);
  $("soundBtn").addEventListener("click", () => {
    const wasMuted = soundMuted();
    store.set(SOUND_KEY, wasMuted ? "on" : "off");
    updateSoundBtn();
    if (wasMuted) playResult(true);
  });

  document.addEventListener("keydown", (e) => {
    // Language panel: Esc closes it (once a language is saved), Tab stays inside it
    if ($("langGate").classList.contains("show")) {
      if (e.key === "Escape" && hasSavedLang()) { closeLangGate(); return; }
      if (e.key === "Tab") {
        const btns = [...document.querySelectorAll(".lang-btn")];
        if (!btns.length) return;
        const first = btns[0], last = btns[btns.length - 1], active = document.activeElement;
        if (!btns.includes(active)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && active === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (state.screen !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key in KEY_TO_OPTION) {
      const btn = $("options").querySelectorAll(".option")[KEY_TO_OPTION[e.key]];
      if (btn && !btn.disabled) btn.click();
      return;
    }
    // If a button has focus, the browser already "clicks" it on Enter -> don't advance twice
    if (e.key === "Enter" && !e.repeat && !(e.target && e.target.tagName === "BUTTON") &&
        $("nextBtn").style.display !== "none") {
      nextQuestion();
    }
  });

  // ------------------------------------------------------------------
  // Start / شروع / Start
  // ------------------------------------------------------------------

  applyTheme();
  applyAccent();
  renderTexts();
  updateSoundBtn();

  if (ALWAYS_ASK_LANGUAGE || !hasSavedLang()) openLangGate();
})();
</script>
</body>
</html>
